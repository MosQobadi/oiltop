# Production stack for a SHARED VPS — this project is a guest on a machine that
# already runs other sites. Two rules follow from that, and both are load-bearing:
#
#   1. Nothing here binds a public port. There is no nginx service; the VPS's
#      existing web server already owns :80/:443 and keeps them. The app is
#      published on the loopback interface only, so the sole way in is through
#      that existing nginx (see deploy/nginx/oil-top.ir.conf).
#   2. `name:` is set explicitly. Compose otherwise derives the project name from
#      the directory, and every container, network and volume is prefixed with
#      it — pinning it to `topoil` guarantees no other stack's `postgres_data`
#      or `app` can be adopted or clobbered by this one.
name: topoil

services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    env_file:
      - .env.production
    volumes:
      - postgres_data:/var/lib/postgresql/data
    # No `ports:` — reachable only by other services on this compose network,
    # never from the host or the internet.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # One-off migration runner: applies pending Prisma migrations and exits.
  # Kept as a separate service (rather than having the app container run
  # `prisma migrate deploy` itself on boot) so migrations run exactly once
  # per deploy even if `app` is later scaled to multiple replicas.
  migrate:
    build:
      context: .
      target: migrator
    env_file:
      - .env.production
    depends_on:
      postgres:
        condition: service_healthy

  app:
    build:
      context: .
      target: runner
      args:
        # Build-time only (see Dockerfile) — the runtime copy still arrives via
        # env_file, but the bundled sitemap/robots URLs are fixed at build.
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-http://localhost:3000}
    restart: unless-stopped
    env_file:
      - .env.production
    volumes:
      - uploads:/app/public/uploads
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    # Bound to 127.0.0.1 on purpose: the port is reachable by the host's nginx
    # and by nothing else, so this can never conflict with — or be exposed
    # alongside — whatever else the VPS is serving.
    #
    # TOPOIL_PORT comes from .env.production, which means every compose command
    # must pass `--env-file .env.production`; `env_file:` above feeds the
    # container's environment but NOT the interpolation done on this line.
    # DEPLOYMENT.md spells the full command out.
    ports:
      - "127.0.0.1:${TOPOIL_PORT:-3001}:3000"

volumes:
  postgres_data:
  uploads:
