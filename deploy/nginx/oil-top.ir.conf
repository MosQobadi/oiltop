# oil-top.ir — server block for the VPS's EXISTING nginx.
#
# This project does not run its own nginx. The VPS already serves other sites,
# and whatever owns :80/:443 keeps owning them; this file is dropped in
# alongside the other sites' configs (see DEPLOYMENT.md for the exact path,
# which differs depending on whether the host nginx is a package install or a
# container). Everything here is scoped inside `server { }` so that adding it
# cannot change the behaviour of any neighbouring site:
#
#   * `gzip` is set per-server, not at http level, so it does not override a
#     global gzip policy the other sites rely on.
#   * The WebSocket upgrade map is named $topoil_connection_upgrade rather than
#     the conventional $connection_upgrade — if another site already defines
#     that name, a duplicate `map` makes nginx refuse to start, taking every
#     site on the box down with it. A unique name cannot collide.
#
# Replace 3001 below if TOPOIL_PORT in .env.production is set to anything else.

# Only sends `Connection: upgrade` when the client actually asked for an
# upgrade; a blanket `Connection "upgrade"` breaks plain HTTP keep-alive.
map $http_upgrade $topoil_connection_upgrade {
    default upgrade;
    ''      close;
}

# Plain HTTP: serves the ACME challenge for certbot's webroot verification,
# redirects everything else to HTTPS.
server {
    listen 80;
    listen [::]:80;
    server_name oil-top.ir www.oil-top.ir;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# Canonical host: www redirects to the bare domain, so there is exactly one
# origin and NEXT_PUBLIC_SITE_URL / sitemap / canonical tags all agree.
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name www.oil-top.ir;

    ssl_certificate     /etc/letsencrypt/live/oil-top.ir/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/oil-top.ir/privkey.pem;

    return 301 https://oil-top.ir$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name oil-top.ir;

    ssl_certificate     /etc/letsencrypt/live/oil-top.ir/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/oil-top.ir/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;
    gzip_min_length 1024;

    # server/upload.ts caps uploads at 5MB; nginx's default cap is 1MB, which
    # would reject a valid image with a 413 before it ever reached the app.
    client_max_body_size 6m;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Content-hashed build output — safe to cache hard and forever.
    location /_next/static/ {
        proxy_pass http://127.0.0.1:3001;
        proxy_set_header Host $host;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location / {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # Next.js reads this to know the request arrived over TLS even though
        # the hop from nginx to the container is plain HTTP — without it,
        # redirects and absolute URLs come back as http://.
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $topoil_connection_upgrade;
    }
}
