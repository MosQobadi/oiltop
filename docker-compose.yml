services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5434:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  # Dedicated database for Playwright E2E runs (see e2e/). Kept separate from
  # `db` above so running the E2E suite (which truncates + reseeds on every
  # run) never touches day-to-day dev data.
  db_test:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${TEST_POSTGRES_USER:-topoil_test}
      POSTGRES_PASSWORD: ${TEST_POSTGRES_PASSWORD:-topoil_test_password}
      POSTGRES_DB: ${TEST_POSTGRES_DB:-topoil_test}
    ports:
      - "5435:5432"
    volumes:
      - postgres_test_data:/var/lib/postgresql/data

volumes:
  postgres_data:
  postgres_test_data:
