# Reverse proxy for the Next.js `app` service. Replace every occurrence of
# `admin.yourdomain.com` below with the real hostname before deploying.
#
# First deploy has a chicken-and-egg problem: this file's HTTPS block
# references a certificate that doesn't exist until certbot has run once,
# and certbot needs nginx serving the ACME challenge over plain HTTP first.
# See DEPLOYMENT.md for the exact bootstrap order (comment out the HTTPS
# block for the very first `docker compose up`, obtain the cert, then
# uncomment it and reload).

gzip on;
gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;
gzip_min_length 1024;

# Plain HTTP: serves the ACME challenge for certbot's webroot verification,
# redirects everything else to HTTPS.
server {
    listen 80;
    listen [::]:80;
    server_name admin.yourdomain.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS: active once a certificate exists at the path below (see
# DEPLOYMENT.md). Comment this whole block out for the very first boot.
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name admin.yourdomain.com;

    ssl_certificate     /etc/letsencrypt/live/admin.yourdomain.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/admin.yourdomain.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        # Resolved per-request via Docker's embedded DNS (127.0.0.11) rather
        # than baked into a plain `proxy_pass http://app:3000`, so nginx
        # doesn't fail at startup if the `app` container isn't up yet and
        # picks up its new IP after a restart without needing a reload.
        resolver 127.0.0.11 valid=10s;
        set $upstream_app app:3000;
        proxy_pass http://$upstream_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
